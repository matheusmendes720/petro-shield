# Netlify configuration for the PetroShield unified monorepo.
#
# This is the SINGLE Netlify site that hosts the hub + 3 sub-apps as
# sub-paths. The build script (./scripts/build.mjs) builds each sub-project
# and hoists the resulting dist/ folders into ./dist/ at the repo root.
#
# Local equivalent: `bun run build` (or `npm run build`) produces the same
# `./dist/` that Netlify publishes. The previous per-sub-project
# `netlify.toml` files are obsolete; they have been moved out of the
# parent's .gitignore and are no longer used.

[build]
  command = "bun run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  BUN_VERSION = "1.1"

# SPA fallbacks — each sub-app is a Vite SPA. Any unknown path inside a
# sub-folder serves that sub-folder's index.html, so client-side routing
# works after a hard refresh.
[[redirects]]
  from = "/axe-guard/*"
  to = "/axe-guard/index.html"
  status = 200

[[redirects]]
  from = "/petroshield-finance/*"
  to = "/petroshield-finance/index.html"
  status = 200

[[redirects]]
  from = "/soc-sys/*"
  to = "/soc-sys/index.html"
  status = 200

# Hub is the root; if someone hits an unknown path at root, fall back to
# the hub's index.html (which renders the Relic Shields landing).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers — applied to the whole site (all sub-paths).
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Per-asset cache — Vite emits content-hashed filenames, so long cache
# is safe.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/axe-guard/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/petroshield-finance/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/soc-sys/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
